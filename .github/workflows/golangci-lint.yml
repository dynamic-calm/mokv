name: golangci-lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
